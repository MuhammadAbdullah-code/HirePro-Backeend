[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hirepro-backend"
version = "0.1.0"
description = "FastAPI backend for HirePro"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cloudinary>=1.41,<2.0",
    "fastapi>=0.115,<1.0",
    "pyjwt>=2.10,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "pymongo>=4.10,<5.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "mongomock>=4.3,<5.0",
    "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
